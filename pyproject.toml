[project]
name = "mqtt-connection-state"
version = "1.1.1"
description = "MQTT connection-state binary sensors for Home Assistant, plus broker and Zigbee2MQTT bridge monitoring."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components"]

[tool.ruff.lint]
# Pragmatic set: real-bug rules (pyflakes, bugbear, async), modernisation and
# import hygiene. Line length is left to the formatter, not the linter.
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "ASYNC", "BLE", "SLF", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "ASYNC"]

[tool.ruff.lint.isort]
# Match Home Assistant core's import style, which the component follows.
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
known-first-party = ["homeassistant", "custom_components.mqtt_connection_state"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
